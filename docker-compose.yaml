services:
  clinic-2026-sample:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/project
      - ${DATA_DIR}:/data
    
    environment:
      DATA_DIR: /data
    
    shm_size: '16gb'
    # At least one of stdin_open or tty is required to make devcontainer work
    stdin_open: true
    tty: true
  
  dashboard:
    image: node:22-slim
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    stdin_open: true
    tty: true
  dashboard-data:
    image: python:3.12-slim
    volumes:
      - ./dashboard:/app
    working_dir: /app
    # profile keeps this one-shot job out of `docker compose up`;
    # `docker compose run dashboard-data` activates it automatically
    profiles: ["tools"]
    command: python3 scripts/pull_data.py
  

volumes:
  dashboard_node_modules:
